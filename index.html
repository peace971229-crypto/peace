<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自走三國：群雄棋局</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--t:84px;--bt:52px;--g:10px;--paper:#efe9dc;--ink:#2b2622;--red:#a8382a;--gold:#c79a3b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cfc7b6;font-family:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#phone{position:relative;margin:0 auto;height:100vh;height:100dvh;max-width:460px;display:flex;flex-direction:column;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%,#f7f3ea,#ebe4d4 70%,#e2d9c5);box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top)}
.brush{font-family:'LXGW WenKai TC','Noto Serif TC',serif}
/* 諸侯列 */
#seats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid #cbbfa8;flex-shrink:0}
.seat{position:relative;padding:3px 3px 4px;text-align:center;cursor:pointer;border-right:1px solid rgba(0,0,0,.05)}
.seat .hp{position:relative;height:8px;margin:0 2px;background:#d8cfbd}
.seat .hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#c94a38,#9b2e21)}
.seat .hp b{position:absolute;right:0;top:-1px;font-size:9px;line-height:10px;color:#fff;text-shadow:0 0 2px #000;padding-right:2px}
.seat .ch{font-size:30px;line-height:40px;font-weight:700;white-space:nowrap;overflow:hidden}
.seat .ch.l2{font-size:21px}
.seat .sub{font-size:10px;color:#8a7f6c;height:13px;line-height:13px}
.seat.me{background:#3b3531;color:#f3ead7}
.seat.me .sub{color:#e7c46b}
.seat.sel{background:#d9cdb2}
.seat.dead{opacity:.3}
.seat.foe::after{content:'對手';position:absolute;right:2px;top:12px;font-size:9px;background:var(--red);color:#fff;padding:0 3px;border-radius:2px}
/* 中段 */
#mid{flex:1;display:flex;min-height:0}
#rail{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 0 6px;overflow-y:auto}
#sell{width:44px;border:1px solid #9b7b47;background:#8b6b3f;color:#fff3d6;border-radius:4px;padding:3px 0;font-size:12px;cursor:pointer;line-height:1.3}
#sell .coin{display:block;font-size:12px;color:#ffe08a}
#sell:disabled{opacity:.35}
.coin::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe8a0,#d39d2a);margin-right:2px;vertical-align:-1px;box-shadow:0 0 0 1px #8c6516}
.tr{width:40px;padding:3px 0 2px;border-radius:5px;text-align:center;background:#d6cebd;color:#8d8475;cursor:pointer;line-height:1.15}
.tr .k{font-size:15px;font-weight:700;line-height:1.1}
.tr .k.sm{font-size:11px;letter-spacing:-1px}
.tr.grp{background:#d9d2c2}
.tr.grp.on{background:linear-gradient(#7b4bb2,#55307f)}
.tr .n{font-size:10px}
.tr.on{background:linear-gradient(#b8813f,#8d5d26);color:#fff8e6}
.tr.fac.on{background:linear-gradient(#5a5048,#3b3531)}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:6px 8px 0 4px;position:relative}
#infoPanel{width:100%;height:128px;font-size:12px;line-height:1.5;overflow:hidden;padding:2px 4px;flex-shrink:0}
#infoPanel .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#infoPanel .hn{font-size:19px;font-weight:900}
#infoPanel .mu{color:#7d7262}
#infoPanel .sk{margin-top:3px;color:#5a4a3a}
#infoPanel .tg{display:inline-block;font-size:10px;line-height:14px;padding:0 3px;border-radius:2px;color:#fff;background:var(--red);margin-right:3px;vertical-align:1px}
#infoPanel .tg.g{background:#9a8f7c}
#infoPanel .tg.on{background:#b8813f}
#infoPanel .off{color:#9a8f7c}
#infoPanel .tip{color:#6f6556;font-size:13px;line-height:1.7}
.fwrap{display:flex;justify-content:center;width:100%}
#enemyWrap{display:none;flex-direction:column;align-items:center;margin-bottom:6px}
#enemyWrap .lab{font-size:12px;color:var(--red);margin-bottom:3px;letter-spacing:.2em}
.fgrid{display:grid;grid-template-columns:repeat(3,var(--t));grid-auto-rows:var(--t);gap:var(--g)}
.gcell{position:relative;border-radius:4px}
#mgrid .gcell:empty{background:rgba(120,100,70,.06);outline:1px dashed rgba(120,100,70,.25);outline-offset:-4px}
#egrid .gcell:empty{background:rgba(160,50,40,.05)}
.gcell.hl,.bslot.hl{background:rgba(199,154,59,.35)!important}
.vsline{display:none;width:70%;height:18px;margin:2px 0 6px;text-align:center;font-size:13px;color:var(--red);letter-spacing:.4em;border-top:1px solid rgba(168,56,42,.35)}
#counts{display:flex;justify-content:space-between;width:calc(var(--t)*3 + var(--g)*2 + 30px);font-size:12px;color:#6f6556;margin-top:6px}
#counts b{color:var(--ink)}
/* 棋子 */
.tile{position:relative;width:100%;height:100%;padding:2px;background:var(--nc);clip-path:polygon(9% 0,91% 0,100% 9%,100% 91%,91% 100%,9% 100%,0 91%,0 9%);cursor:pointer;touch-action:none}
.tile .in{position:relative;width:100%;height:100%;background:linear-gradient(#fbf8f0,#f1ebdd);clip-path:polygon(8% 0,92% 0,100% 8%,100% 92%,92% 100%,8% 100%,0 92%,0 8%);display:flex;align-items:center;justify-content:center}
.tile .nm{font-family:'LXGW WenKai TC','Noto Serif TC',serif;font-weight:700;color:var(--nc);font-size:calc(var(--ts)*.3);line-height:1.02;text-align:center}
.tile.n3 .nm{font-size:calc(var(--ts)*.22)}
.tile.n4 .nm{font-size:calc(var(--ts)*.25);line-height:1.08}
.tile .atk{position:absolute;left:4%;top:2%;font-size:calc(var(--ts)*.14);color:#4d453c;font-weight:700}
.tile .df{position:absolute;right:5%;bottom:3%;font-size:calc(var(--ts)*.14);color:var(--nc);font-weight:700}
.tile .bd{position:absolute;left:4%;top:24%;display:flex;flex-direction:column;gap:2px}
.tile .bd i{font-style:normal;display:block;width:calc(var(--ts)*.17);height:calc(var(--ts)*.17);font-size:calc(var(--ts)*.12);line-height:calc(var(--ts)*.17);text-align:center;color:#fff;border-radius:2px;background:#c4713a}
.tile .st{position:absolute;right:4%;top:2%;font-size:calc(var(--ts)*.13);color:#fff;background:#b8813f;padding:0 3px;border-radius:2px;font-weight:700}
.tile.s3 .st{background:#c23030}
.tile .bars{position:absolute;left:6%;right:6%;bottom:5%;display:none}
.inb .tile .bars{display:block}
.inb .tile .df{display:none}
.tb{position:relative;height:6px;background:#3d1a14;border-radius:1px;overflow:hidden}.tb i{position:absolute;left:0;top:0;bottom:0;background:#4a9a4f}.tb s{position:absolute;right:0;top:0;bottom:0;background:rgba(255,255,255,.85)}
.side1 .tb i{background:#c8452f}
.rb{height:3px;margin-top:1px;background:#d8cfbd}.rb i{display:block;height:100%;background:#d98a1f}
.holder{width:100%;height:100%;--ts:var(--t)}
.holder.sel .tile{background:#e3b23c;filter:drop-shadow(0 0 5px #e3b23c)}
.holder.dead .tile{filter:grayscale(1);opacity:.35}
.holder.dead::after{content:'敗';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:calc(var(--ts)*.5);font-family:'LXGW WenKai TC',serif;font-weight:700;opacity:.85;transform:rotate(-12deg)}
.holder.stun .in{background:#d6dbe6}
.holder.wait .tile{opacity:.82}
.holder{position:relative}
.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.9;transform:scale(1.08)}
/* 備戰席 */
#bench{display:grid;grid-template-columns:repeat(6,var(--bt));gap:6px;justify-content:center;padding:8px 0 6px;flex-shrink:0}
.bslot{height:var(--bt);border-radius:4px;background:rgba(120,100,70,.08);outline:1px dashed rgba(120,100,70,.28);outline-offset:-3px}
.bslot .holder{--ts:var(--bt)}
/* 商店 */
#shopArea{position:relative;flex-shrink:0;padding:4px 8px 6px}
#shopArea svg{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:100%;pointer-events:none}
#shop{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc{position:relative;height:62px;border:none;padding:2px;background:var(--nc);clip-path:polygon(7% 0,93% 0,100% 10%,100% 90%,93% 100%,7% 100%,0 90%,0 10%);cursor:pointer}
.sc .in{height:100%;background:linear-gradient(#fdfaf2,#efe7d6);clip-path:polygon(6% 0,94% 0,100% 9%,100% 91%,94% 100%,6% 100%,0 91%,0 9%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.sc .cn{font-family:'LXGW WenKai TC',serif;font-weight:700;font-size:17px;color:var(--nc);line-height:1.1}
.sc .cm{font-size:10px;color:#7d7262}
.sc .co{font-size:11px;font-weight:700;color:#8c6516}
.sc.empty{visibility:hidden}
.sc.cant{opacity:.45}
.sc.own{background:#e3b23c;filter:drop-shadow(0 0 4px #e3b23c)}
.sc.own::after{content:'可升階';position:absolute;top:2px;right:4px;font-size:9px;color:#fff;background:#c23030;padding:0 2px}
body.dragging #shopArea::after{content:'拖到這裡出售';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(168,56,42,.8);color:#fff;font-size:18px;letter-spacing:.3em;z-index:3}
/* 底部 */
#bottom{position:relative;flex-shrink:0;background:linear-gradient(#4a3d33,#2c241e);padding:16px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:8px;border-top:3px solid #7a6247}
#lvYear{position:absolute;left:50%;top:-13px;transform:translateX(-50%);display:flex;gap:6px;align-items:center}
#lvYear span{background:#3b3531;color:#f3ead7;font-size:12px;padding:1px 10px;border-radius:10px;border:1px solid #7a6247;white-space:nowrap}
#lvYear .xp{width:46px;height:5px;background:#5c5047;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:4px;padding:0;border:none}
#lvYear .xp i{display:block;height:100%;background:#7fb8ff}
.kb{width:54px;height:54px;border:none;border-radius:6px;background:linear-gradient(#f4eddc,#d8ccb0);box-shadow:0 3px 0 #1b1612;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.kb .k{font-family:'LXGW WenKai TC',serif;font-size:22px;font-weight:700}
.kb .c{font-size:10px;color:#6f6556}
.kb:disabled{opacity:.4;cursor:default}
.kb.on{background:linear-gradient(#f2d48a,#c79a3b)}
#fight{width:104px;height:58px;border:none;border-radius:6px;background:linear-gradient(#c4503b,#842617);color:#fff3dc;font-family:'LXGW WenKai TC',serif;font-size:24px;font-weight:700;letter-spacing:.2em;box-shadow:0 3px 0 #3e100a;cursor:pointer}
#fight:disabled{filter:grayscale(.7);opacity:.6}
/* 特效 */
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fxt{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:15px;color:#b3261a;text-shadow:0 0 3px #fff,0 0 2px #fff;animation:fup .8s forwards;white-space:nowrap}
.fxt.sk{font-size:19px;color:#d25a00}
.fxt.heal{color:#2f8a3a}
.fxt.name{font-family:'LXGW WenKai TC',serif;font-size:16px;color:#fff;background:rgba(43,38,34,.85);padding:1px 8px;border-radius:3px;text-shadow:none;animation-duration:1.2s}
@keyframes fup{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-30px}}
.arrow{position:absolute;width:14px;height:3px;margin:-1px 0 0 -7px;background:#3b3531;border-radius:2px;transition:left .2s linear,top .2s linear}
.orb{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(#fff3c4,#e2742a);box-shadow:0 0 10px #ff9a3c;transition:left .25s ease-in,top .25s ease-in}
.burst{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:3px solid #e2742a;animation:burst .45s forwards}
@keyframes burst{to{transform:scale(7);opacity:0}}
#toast{position:absolute;left:0;right:0;top:78px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
#toast div{background:rgba(43,38,34,.9);color:#f3ead7;font-size:13px;padding:5px 14px;border-radius:3px;animation:tin 2.6s forwards;max-width:90%;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#overlay{position:absolute;inset:0;z-index:90;background:rgba(43,38,34,.55);display:none;align-items:center;justify-content:center;padding:14px}
.panel{width:100%;max-height:92%;overflow:auto;background:linear-gradient(#faf6ec,#ece4d2);border:2px solid #7a6247;border-radius:6px;padding:18px 18px;font-size:13px;line-height:1.7}
.panel h1{margin:0;font-family:'LXGW WenKai TC',serif;font-size:32px;letter-spacing:.25em;text-align:center}
.panel h2{font-size:15px;margin:10px 0 2px;color:var(--red)}
.panel ul{margin:0;padding-left:18px}
.namebox{display:flex;gap:8px;justify-content:center;margin:8px 0}
:root{color-scheme:light}
.namebox input{color:#2b2622!important;-webkit-text-fill-color:#2b2622;caret-color:#a8382a}
.namebox input::placeholder{color:#b3a891;-webkit-text-fill-color:#b3a891}
.code{font-family:'LXGW WenKai TC',serif;font-size:44px;letter-spacing:.3em;color:#a8382a;font-weight:700;margin:2px 0}
.lobbylist{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;text-align:left;max-width:300px;margin:0 auto;font-size:15px}
.go.ghost2{background:#9a8f7c;font-size:14px;padding:6px 26px;margin-top:8px}
.dbtn:disabled{opacity:.4;cursor:default}
.seat.hum .ch{color:#a8382a}
#fight.rdy{background:linear-gradient(#5b8a4a,#2f5a25)}
#fight{font-size:20px}
.namebox input{width:170px;font-family:'LXGW WenKai TC',serif;font-size:20px;padding:6px 10px;border:2px solid #7a6247;border-radius:5px;background:#fbf8f0;text-align:center}
.dbtn{padding:6px 16px;border:2px solid #7a6247;border-radius:5px;background:#f4eddc;font-size:15px;cursor:pointer}.dbtn.on{background:#c79a3b;color:#fff}
.odds{width:100%;border-collapse:collapse;font-size:11px;text-align:center;margin-top:4px}.odds td,.odds th{border:1px solid #d3c8b2;padding:1px}
.go{display:block;margin:14px auto 0;padding:8px 34px;border:none;border-radius:5px;background:linear-gradient(#c4503b,#842617);color:#fff;font-size:17px;letter-spacing:.2em;cursor:pointer;font-family:'LXGW WenKai TC',serif}
</style>
</head>
<body>
<div id="phone">
 <div id="seats"></div>
 <div id="mid">
  <div id="rail">
   <button id="sell" disabled><span class="coin" id="sellVal">0</span>出售</button>
   <div id="traits" style="display:flex;flex-direction:column;gap:5px;align-items:center"></div>
  </div>
  <div id="stage">
   <div id="infoPanel"></div>
   <div id="enemyWrap"><div class="lab" id="eLab"></div><div class="fgrid" id="egrid"></div></div>
   <div class="vsline" id="vsline">交鋒</div>
   <div id="myWrap"><div class="fgrid" id="mgrid"></div></div>
   <div id="counts"><span>▴上陣：<b id="cBoard">0/3</b></span><span>▾備戰：<b id="cBench">0/6</b></span></div>
  </div>
 </div>
 <div id="bench"></div>
 <div id="shopArea">
  <svg viewBox="0 0 460 90" preserveAspectRatio="none" aria-hidden="true">
   <path d="M0 90 L0 55 Q40 30 70 48 Q95 20 130 40 Q160 10 200 42 Q230 28 260 50 Q300 18 340 44 Q370 26 400 46 Q430 30 460 40 L460 90Z" fill="#b9b0a0" opacity=".35"/>
   <path d="M0 90 L0 70 Q50 50 90 66 Q130 44 170 64 Q210 52 250 68 Q300 46 350 66 Q400 54 460 62 L460 90Z" fill="#8f877a" opacity=".35"/>
  </svg>
  <div id="shop"></div>
 </div>
 <div id="bottom">
  <div id="lvYear"><span id="lvTxt">3級<span class="xp"><i id="xpBar"></i></span></span><span id="yearTxt">184年</span><span class="coin" id="goldTxt">10</span></div>
  <button class="kb" id="bRoll" title="快捷鍵 D"><span class="k">刷</span><span class="c">2金</span></button>
  <button class="kb" id="bXp" title="快捷鍵 F"><span class="k">升</span><span class="c">4金</span></button>
  <button id="fight" title="空白鍵">出戰</button>
  <button class="kb" id="bLock"><span class="k">鎖</span><span class="c">商店</span></button>
  <button class="kb" id="bSpd"><span class="k">速</span><span class="c" id="spdTxt">×1</span></button>
 </div>
 <div id="fx"></div>
 <div id="toast"></div>
 <div id="overlay"></div>
</div>

<script>
'use strict';
/* ==================== 資料 ==================== */
// 稀有度：2費綠、3費藍、4費紫、5費金、5費以上紅
const COST_C={2:'#3f8a3a',3:'#2a6fc0',4:'#7b4bb2',5:'#c08a12',6:'#c23030',8:'#c23030'};
const COST_N={2:'綠',3:'藍',4:'紫',5:'金',6:'紅',8:'紅'};
const TIERS=[2,3,4,5,6,8];
/* 職業（暫定效果，之後依企劃替換） */
const CLS={
 dao:  {n:'刀',full:'刀',iv:1.2,melee:1,sd:'橫掃：對目標及其左右兩側造成 170% 傷害'},
 jian: {n:'劍',full:'劍',iv:1.0,melee:1,sd:'連斬：對目標連砍兩次，各 140% 傷害'},
 qiang:{n:'槍',full:'槍',iv:1.2,melee:1,sd:'突刺：目標受 220% 傷害，並穿透後一排敵人（穿透傷害 -80%，約 44%）'},
 mou:  {n:'謀',full:'謀',iv:1.6,sd:'計策：對目標及其上下左右造成 170% 傷害'},
 gong: {n:'弓',full:'弓',iv:1.3,sd:'齊射：對敵方最前排全體造成 100% 傷害'},
 dun:  {n:'盾',full:'盾',iv:1.5,melee:1,sd:'堅守：獲得 35% 最大士兵的護盾'},
 qi:   {n:'騎',full:'騎',iv:1.1,back:1,sd:'突襲：目標受 200% 傷害並暈眩 1.5 秒'},
 fang: {n:'方',full:'方',iv:1.5,heal:1,sd:'回春：為生命最低的友軍恢復 300% 攻擊力的士兵'},
 mo:   {n:'魔',full:'魔',iv:1.25,sd:'吞噬：造成 200% 傷害，並回復造成傷害 50% 的士兵'}
};
const MELEE_AD='任何位置皆可出手；只能攻擊敵方最前排，優先打離自己最近的';
const RANGE_AD='任何位置皆可出手；只能攻擊敵方最前排，優先打離自己最近的';
const BACK_AD='【特性・繞後】任何位置皆可出手，攻擊敵方最後排中離自己最近的';
const PIERCE=0.2; // 槍兵穿透傷害 -80%（後一格受到 20%）
const SPECIAL={}; // 武將個別特性（目前無；弓兵同樣只能先打最前排）
const HEROES=[
 ["張遼", 4, ["dao"], ["gwei"], 97, 66, 410, "威震逍遙"],
 ["樂進", 2, ["dao"], ["gwei"], 62, 42, 260, "驍果"],
 ["張飛", 3, ["dao"], ["g5h"], 83, 54, 370, "據水斷橋"],
 ["關羽", 4, ["dao"], ["g5h"], 106, 66, 410, "武聖"],
 ["孫權", 3, ["dao"], ["g3k", "gsun"], 75, 56, 350, "坐斷東南"],
 ["關平", 2, ["dao"], [], 62, 42, 260, "承父志"],
 ["李典", 2, ["dao"], [], 62, 42, 260, "儒將"],
 ["于禁", 2, ["jian"], ["gwei"], 56, 50, 270, "毅重"],
 ["素戔鳴", 4, ["jian"], ["gxian"], 87, 78, 420, "天叢雲"],
 ["應龍", 5, ["jian"], ["gxian"], 103, 92, 500, "蓄水"],

function traitCounts(units){const seen=new Set(),c={};units.forEach(u=>{if(seen.has(u.heroId))return;seen.add(u.heroId);const h=H[u.heroId];h.cls.concat(h.grp).forEach(k=>c[k]=(c[k]||0)+1)});return c}
function traitLevel(k,n){let l=0;TRAITS[k].th.forEach(t=>{if(n>=t)l++});return l}

class Battle{

   team.forEach(u=>{const b=makeBU(u,side);b.id=id++;this.units.push(b)})});

 }
 has(u,k){return u.h.cls.includes(k)||u.h.grp.includes(k)}

  for(const u of this.units){
   const lmo=this.L(u,'mo');if(lmo)u.hp*=1+[0,.1,.2,.4][lmo];

   if(this.on(u,'g3k')){const n=this.units.filter(v=>v.side===u.side&&!NON_SANGUO.has(v.h.name)&&!v.h.grp.includes('g3k')).length;u.atk*=1+.03*n;u.def*=1+.03*n}
   if(this.on(u,'gsun')){const os=this.units.filter(v=>v!==u&&v.side===u.side&&v.h.grp.includes('gsun'));u.atk+=.04*os.reduce((s,v)=>s+v.baseAtk,0);u.def+=.04*os.reduce((s,v)=>s+v.baseDef,0)}

  }

   this.units.forEach(v=>{if(v!==u&&v.side===u.side&&v.h.cls.includes('mo')){const x=v.hp*.3;v.hp-=x;v.maxHp-=x;eat+=x}});
   if(eat>0){u.hp+=eat/3;u.maxHp+=eat/3;u.atk+=eat/3;u.devour=Math.round(eat)}}
 }
 emit(e){if(this.onEv)this.onEv(e)}
 foes(u){return this.units.filter(v=>!v.dead&&v.side!==u.side)}

 // 預設只能打敵方最前排（仍有武將存活的最靠前一排），優先打橫向最近者；同距離打士兵少者
 pickRow(u,back){const fs=this.foes(u);if(!fs.length)return null;const row=back?Math.max(...fs.map(v=>v.r)):Math.min(...fs.map(v=>v.r));
  return fs.filter(v=>v.r===row).sort((a,b)=>Math.abs(a.c-u.c)-Math.abs(b.c-u.c)||a.hp-b.hp||a.c-b.c)[0]}
 target(u){if(u.h.sp==='snipe'){const fs=this.foes(u);return fs.length?fs.reduce((a,b)=>(b.hp<a.hp?b:a)):null}
  return this.pickRow(u,!!CLS[pcls(u.h)].back)}
 effAtk(u){let a=u.atk;const lq=this.L(u,'qi');if(lq){const n=this.allies(u).filter(v=>v.h.cls.includes('qi')).length;a*=1+[0,.05,.1][lq]*n}
  if(u.berserk)a*=1+.3*u.berserk;if(u.lbDeaths)a*=1+.2*u.lbDeaths;return a}

   el.animate([{transform:'none'},{transform:`translate(${(t.x-a.x)*(e.melee?.32:.06)}px,${(t.y-a.y)*(e.melee?.32:.06)}px) scale(1.06)`},{transform:'none'}],{duration:dur(280),easing:'ease-out'});
   els.get(e.tg).querySelector('.tile').animate([{transform:'none'},{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'none'}],{duration:dur(200),delay:dur(130)})}

const HIDX={};HEROES.forEach((h,i)=>HIDX[h.id]=i);
const c2=i=>i.toString(36).padStart(2,'0');
function encP(p){return[p.name,Math.max(-99,p.hp),p.gold,p.level,p.xp,p.alive?1:0,p.place,p.streak,(p.locked?1:0)|(p.ready?2:0)|(p.human?4:0)|(p.offline?8:0),
 p.board.map(u=>c2(HIDX[u.heroId])+u.star+(u.r*3+u.c)).join(''),p.bench.map(u=>u?c2(HIDX[u.heroId])+u.star:'---').join(''),p.shop.map(h=>h?c2(HIDX[h]):'--').join(''),p.peer||'']}
function decP(a,i){const[name,hp,gold,level,xp,al,place,streak,fl,bs,ns,ss,peer]=a;
 const p={id:i,name:String(name).slice(0,8),hp,gold,level,xp,alive:!!al,place,streak,locked:!!(fl&1),ready:!!(fl&2),human:!!(fl&4),offline:!!(fl&8),peer:peer||null,board:[],bench:Array(BENCH).fill(null),over:[],shop:[]};
 const hero=s=>{const h=HEROES[parseInt(s,36)];return h&&h.id};
 for(let k=0;k+3<bs.length;k+=4){const id=hero(bs.substr(k,2)),pos=+bs[k+3];if(id)p.board.push({uid:G.uid++,heroId:id,star:+bs[k+2],r:Math.floor(pos/3),c:pos%3})}

 for(let k=0;k<5;k++){const s=ss.substr(k*2,2);p.shop.push(s==='--'?null:hero(s)||null)}
 return p}
function encodeState(){return{v:++G.ver,ph:G.phase,rd:G.round,tl:G.timer,df:G.diff,pl:G.players.map(encP),pr:G.phase==='combat'&&G.pairs?G.pairs.map(x=>[x.a,x.b,x.seed,x.ghost?1:0]):null}}
function applyState(st){
 if(!st||!Array.isArray(st.pl))return;
 if(G.animating&&st.ph!=='combat'){G.pendingState=st;return}
 const wasPrep=G.phase;
 G.round=st.rd;G.phase=st.ph;G.timer=st.tl;G.diff=st.df;
 G.players=st.pl.map(decP);
 G.myIdx=Math.max(0,G.players.findIndex(p=>p.peer===Net.myPeer));
 if(G.players[G.myIdx].peer!==Net.myPeer)G.spectator=true;
 if($('#overlay').dataset.kind==='lobby')closeOverlay();
 if(st.ph==='combat'){
  G.pairs=(st.pr||[]).map(([a,b,seed,g])=>({a,b,seed,ghost:!!g}));
  if(G.animRd!==G.round){G.animRd=G.round;G.sel=null;G.scout=null;playMyBattle(()=>Net.send({t:'done',rd:G.round}))}
  else renderSeats();
  return}

 if(st.ph==='end'){setMode();renderAll();showEnd();return}

/* 獨立網頁版連線：PeerJS 點對點（WebRTC）。房主的瀏覽器跑全部規則，其他人送動作、收狀態 */
const Net={
 peer:null,conns:new Map(),code:null,myPeer:null,lobbyPeers:[],hostConn:null,hostPeer:null,tick:null,bcastT:null,seq:0,err:null,
 async init(){for(let i=0;i<40&&!window.Peer;i++)await new Promise(r=>setTimeout(r,250));if(!window.Peer){this.why='nolib';return false}return true},
 genCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s},
 pid(code){return 'zzsg-room-'+code},
 newPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id,{debug:0}):new Peer({debug:0});
  const t=setTimeout(()=>rej({code:'逾時，請檢查網路'}),15000);
  p.on('open',pid=>{clearTimeout(t);res(p)});p.on('error',e=>{clearTimeout(t);rej({code:e.type})})})},
 async host(name){
  this.leave(true);G.mode='host';G.players=null;this.myName=name;this.lobbyPeers=[];this.err=null;
  for(let k=0;k<4;k++){const code=this.genCode();try{this.peer=await this.newPeer(this.pid(code));this.code=code;break}catch(e){if(e.code!=='unavailable-id')throw e}}
  if(!this.peer)throw{code:'無法取得房間代碼'};
  this.myPeer=this.peer.id;
  this.peer.on('connection',conn=>{
   conn.on('data',m=>this.onHostMsg(conn,m));
   conn.on('close',()=>this.onHostLeft(conn));conn.on('error',()=>this.onHostLeft(conn))});
  this.peer.on('disconnected',()=>{try{this.peer.reconnect()}catch(e){}});
  this.peer.on('error',e=>{if(e.type!=='peer-unavailable'){this.err=e.type;this.refreshLobby()}});
  showLobby();
 },
 onHostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){
   if(G.players){conn.send({t:'full',why:'遊戲已開始'});return}
   if(this.lobbyPeers.length>=5){conn.send({t:'full',why:'房間已滿'});return}
   this.conns.set(conn.peer,conn);
   this.lobbyPeers=this.lobbyPeers.filter(p=>p.peer!==conn.peer).concat([{peer:conn.peer,presence:{name:String(m.name||'無名').slice(0,8)}}]);
   this.sendLobby();showLobby();return}
  if(m.t==='act'&&G.players){const p=G.players.find(x=>x.peer===conn.peer);if(!p)return;const a=m.a;if(!a||typeof a!=='object')return;
   if(a.t==='done'){if(a.rd===G.round&&G.done)G.done.add(p.id)}else applyAction(p,a);
   this.broadcast();renderAll();hostCheck()}
 },
 onHostLeft(conn){
  this.conns.delete(conn.peer);
  if(!G.players){this.lobbyPeers=this.lobbyPeers.filter(p=>p.peer!==conn.peer);this.sendLobby();showLobby();return}
  const p=G.players.find(x=>x.peer===conn.peer);if(p&&!p.offline){p.offline=true;p.ready=false;toast(`${p.name} 離線，改由電腦代管`);this.broadcast();renderAll();hostCheck()}
 },
 lobbyNames(){return[this.myName].concat(this.lobbyPeers.map(p=>p.presence.name))},
 sendLobby(){const l=this.lobbyNames();this.conns.forEach(c=>{try{c.send({t:'lobby',lobby:l})}catch(e){}})},
 async join(code,name){
  this.leave(true);G.mode='client';G.players=null;G.animRd=0;G.shownOver=false;G.spectator=false;this.myName=name;this.code=code;this.err=null;this.hostPeer=null;
  this.peer=await this.newPeer();this.myPeer=this.peer.id;
  await new Promise((res,rej)=>{
   const conn=this.peer.connect(this.pid(code),{reliable:true});const t=setTimeout(()=>rej({code:'找不到房間（代碼錯誤或房主已離開）'}),12000);
   this.peer.on('error',e=>{if(e.type==='peer-unavailable'){clearTimeout(t);rej({code:'找不到這個代碼的房間'})}});
   conn.on('open',()=>{clearTimeout(t);this.hostConn=conn;this.hostPeer=conn.peer;conn.send({t:'hello',name});res()});
   conn.on('data',m=>this.onClientMsg(m));
   conn.on('close',()=>this.onHostGone());conn.on('error',()=>this.onHostGone());
  });
  showLobby([]);
 },
 onClientMsg(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='lobby'){this.lastLobby=m.lobby;this.refreshLobby()}
  else if(m.t==='st')applyState(m.st);
  else if(m.t==='full'){toast('無法加入：'+m.why);this.leave();intro()}
 },
 onHostGone(){if(!this.hostConn)return;this.hostConn=null;this.hostPeer=null;if(G.phase==='end')return;toast('房主已離線，連機結束');setTimeout(()=>{this.leave();intro()},1500)},
 refreshLobby(){if($('#overlay').dataset.kind==='lobby'&&!G.players)showLobby(this.lastLobby)},
 diag(){return `連線：${this.peer&&!this.peer.destroyed?'已連線':'未連線'}${this.err?'（'+this.err+'）':''}${G.mode==='host'?`・已加入 ${this.conns.size} 人`:''}`},
 leave(silent){if(this.tick){clearInterval(this.tick);this.tick=null}
  const p=this.peer;this.peer=null;this.hostConn=null;this.conns.forEach(c=>{try{c.close()}catch(e){}});this.conns=new Map();
  if(p){try{p.destroy()}catch(e){}}this.code=null;this.lobbyPeers=[];this.lastLobby=null;if(!silent)G.mode='solo'},
 send(a){if(this.hostConn&&this.hostConn.open)this.hostConn.send({t:'act',id:++this.seq,a})},
 broadcast(){if(G.mode!=='host'||this.bcastT)return;this.bcastT=setTimeout(()=>{this.bcastT=null;if(!G.players)return;const st=encodeState();this.conns.forEach(c=>{try{if(c.open)c.send({t:'st',st})}catch(e){}})},40)},
 startGame(){
  const humans=[{name:this.myName,peer:this.myPeer}].concat(this.lobbyPeers.map(p=>({name:p.presence.name,peer:p.peer})));
  const seen={};humans.forEach(h=>{if(seen[h.name])h.name=h.name.slice(0,6)+(++seen[h.name]);else seen[h.name]=1});
  G.myIdx=0;setupGame(humans);closeOverlay();setMode();renderAll();this.broadcast();
  this.tick=setInterval(()=>{if(G.mode!=='host'||!G.players)return;
   if(G.phase==='prep'){G.timer--;const hs=G.players.filter(p=>p.alive&&p.human&&!p.offline);
    if(G.timer<=0||hs.every(p=>p.ready))startCombat();else{this.broadcast();renderHUD();renderSeats()}}
   else if(G.phase==='combat')hostCheck()},1000);
 }
};

/* ==================== 面板 ==================== */
function showPanel(html,kind){const o=$('#overlay');o.innerHTML=html;o.dataset.kind=kind||'';o.style.display='flex'}
function closeOverlay(){const o=$('#overlay');o.style.display='none';o.dataset.kind=''}
function showLobby(names){
 const isHost=G.mode==='host';
 const list=isHost?[Net.myName].concat(Net.lobbyPeers.map(p=>String(p.presence.name).slice(0,8))):(names||[]);
 const hostMissing=!isHost&&!Net.hostPeer;
 const ai=Math.max(0,6-Math.max(1,list.length));
 showPanel(`<div class="panel" style="text-align:center"><h1 style="font-size:24px">連機大廳</h1>
  <div style="color:#7d7262">房間代碼</div><div class="code">${esc(Net.code||'')}</div>
  <div style="font-size:12px;color:#7d7262">朋友打開這個遊戲網址，點「加入房間」輸入代碼即可加入</div>
  <h2>已加入的主公（${list.length}/6）</h2>
  <div class="lobbylist">${list.length?list.map((n,i)=>`<div>${i===0?'👑 ':''}${esc(n)}${(isHost&&i===0)||(!isHost&&n===Net.myName)?'（你）':''}</div>`).join(''):'<div style="color:#9a8f7c">連線中…</div>'}
  ${Array.from({length:ai},()=>`<div style="color:#9a8f7c">空位 → 電腦</div>`).join('')}</div>
  ${isHost?`<div style="font-size:12px;color:#7d7262;margin-top:6px">電腦難度：${DIFF[G.diff].n}</div><button class="go" id="lgo">開始遊戲</button>`:(hostMissing?'<p style="color:#a8382a">與房主的連線中斷</p>':'<p style="color:#7d7262">等待房主開始…</p>')}
  <button class="go ghost2" id="lquit">離開</button><div style="font-size:11px;color:#9a8f7c;margin-top:8px">${esc(Net.diag())}</div></div>`,'lobby');
 if(isHost)$('#lgo').onclick=()=>Net.startGame();
 $('#lquit').onclick=()=>{Net.leave();intro()};
}

/* ==================== 按鈕 ==================== */
$('#bRoll').onclick=()=>{if(G.phase==='prep')act({t:'roll'})};
$('#bXp').onclick=()=>{if(G.phase==='prep')act({t:'xp'})};
$('#bLock').onclick=()=>{if(G.phase!=='prep')return;toast(me().locked?'商店解鎖':'商店已鎖定，下回合保留');act({t:'lock'})};
$('#bSpd').onclick=()=>{if(G.phase==='combat'&&G.speed===4){G.skip=true;return}G.speed=G.speed===1?2:G.speed===2?4:1;renderHUD();if(G.phase==='combat'&&G.speed===4)toast('再按一次「速」可跳過戰鬥動畫')};
$('#fight').onclick=pressFight;
$('#sell').onclick=()=>{if(G.sel&&G.phase==='prep'){const s=G.sel;G.sel=null;act({t:'sell',s})}};
addEventListener('keydown',e=>{if($('#overlay').style.display==='flex'||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
 if(k==='d')$('#bRoll').click();else if(k==='f')$('#bXp').click();else if(k==='e')$('#sell').click();else if(e.code==='Space'){e.preventDefault();pressFight()}});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,100)});

/* ==================== 開場 ==================== */
function intro(){
 const rows=Object.keys(ODDS).map(l=>`<tr><td>${l}級</td>${ODDS[l].map(v=>`<td>${v?v+'%':'—'}</td>`).join('')}</tr>`).join('');
 showPanel(`<div class="panel"><h1>自走三國</h1><div style="text-align:center;color:#7d7262">群雄棋局・六方諸侯淘汰賽</div>
 <h2>為你的陣營取名</h2><div class="namebox"><input id="myName" maxlength="6" placeholder="例如：蒼天" autocomplete="off" value="${esc(G.lastName||'')}"></div>
 <h2>電腦對手難度</h2><div class="namebox">${DIFF.map((d,i)=>`<button class="dbtn ${i===G.diff?'on':''}" data-d="${i}">${d.n}</button>`).join('')}</div>
 <button class="go" id="solo">單機出征</button>
 <h2>連機對戰（2～6 人，空位由電腦補上）</h2>
 <div class="namebox"><button class="dbtn" id="mkroom">建立房間</button></div>
 <div class="namebox"><input id="code" maxlength="4" placeholder="房間代碼" autocomplete="off" style="width:120px;text-transform:lowercase"><button class="dbtn" id="joinroom">加入房間</button></div>
 <div id="netmsg" style="text-align:center;font-size:12px;color:#7d7262">檢查連線功能中…</div>
 <details><summary style="cursor:pointer;color:#a8382a;margin-top:10px">遊戲規則與刷新機率</summary><ul>
 <li>招募武將放入備戰席，拖曳（或點選再點格子）佈進 <b>3×3 方陣</b>；上陣人數＝等級＋2（最多 9）。</li>
 <li>武將<b>站樁不移動</b>。攻擊只能打<b>敵方最前排</b>，優先打離自己最近的；所有職業站在任何位置都能出手。</li>
 <li>出手累積怒氣，滿 100 施放技能。三個同名同階自動升階。同職業或武將組合湊到門檻觸發羈絆（左側欄）。</li>
 <li>稀有度：<b style="color:${COST_C[2]}">2費綠</b>・<b style="color:${COST_C[3]}">3費藍</b>・<b style="color:${COST_C[4]}">4費紫</b>・<b style="color:${COST_C[5]}">5費金</b>・<b style="color:${COST_C[6]}">6費以上紅</b></li>
 <li>快捷鍵：<b>D</b> 刷新、<b>F</b> 升級、<b>E</b> 出售、<b>空白鍵</b> 出戰。</li></ul>
 <table class="odds"><tr><th></th>${TIERS.map(c=>`<th style="color:${COST_C[c]}">${c}費</th>`).join('')}</tr>${rows}</table></details></div>`,'intro');
 const o=$('#overlay');
 o.querySelectorAll('.dbtn[data-d]').forEach(b=>b.onclick=()=>{G.diff=+b.dataset.d;o.querySelectorAll('.dbtn[data-d]').forEach(x=>x.classList.toggle('on',x===b))});
 const nm=()=>{const v=$('#myName').value.trim()||'無名';G.lastName=v;return v};
 $('#solo').onclick=()=>{Net.leave();newSolo(nm())};
 $('#myName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#solo').click()});
 const netOk=ok=>{const m=$('#netmsg');if(!m)return;$('#mkroom').disabled=$('#joinroom').disabled=!ok;
  m.innerHTML=ok?'連機可用：建立房間後把 4 碼代碼告訴朋友（朋友打開同一個網址即可加入）':'連線元件載入失敗，請檢查網路後重新整理頁面'};
 $('#mkroom').disabled=$('#joinroom').disabled=true;$('#netmsg').textContent='載入連線元件中…';
 Net.init().then(netOk);
 $('#mkroom').onclick=async()=>{try{$('#netmsg').textContent='建立房間中…';await Net.host(nm())}catch(e){$('#netmsg').textContent='建立失敗：'+(e&&e.code||e)}};
 $('#joinroom').onclick=async()=>{const c=$('#code').value.trim().toLowerCase();if(!/^[a-z0-9]{4}$/.test(c)){$('#netmsg').textContent='請輸入 4 碼房間代碼';return}
  try{$('#netmsg').textContent='加入中…';await Net.join(c,nm())}catch(e){$('#netmsg').textContent='加入失敗：'+(e&&e.code||e)}};
}
buildGrids();G.rng=mulberry32(1);G.mode='solo';G.myIdx=0;setupGame([{name:'我軍'}]);setMode();renderAll();intro();
</script>
</body>
</html>
